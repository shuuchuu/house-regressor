[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = [
  "dvc >= 3",
  "dvc-s3 >= 3",
  "evidently >= 0.4",
  "fastapi >= 0.115",
  "mlflow >= 2",
  "pandas >= 2",
  "scikit-learn >= 1",
]
description = "Prédiction des prix de vente de maisons."
homepage = "https://github.com/shuuchuu/house-regressor"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "house-regressor"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[project.scripts]
house-regressor = "house_regressor.cli:main"

[dependency-groups]
dev = [
  "pytest >= 9",
  "ruff >= 0.17",
  "ty >= 0.0.88",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["X", "X_*", "Y", "Y_*"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14.0"]
